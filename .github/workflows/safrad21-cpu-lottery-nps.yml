name: Safrad free CPU-host discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safrad21-cpu-lottery-nps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample_host:
    strategy:
      fail-fast: false
      matrix:
        attempt: [0, 1, 2, 3, 4, 5]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SAFRAD_COMPARISON_RUNNER: sweep-${{ matrix.attempt }}
      SAFRAD_COMPARISON_SECONDS: '120'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check requests psutil
      - name: Benchmark exact Safrad 2.1 binary on assigned CPU
        shell: pwsh
        run: python -u safrad_benchmark/compare_free_runners.py
      - name: Archive trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safrad-nps-sweep-${{ matrix.attempt }}
          path: safrad_benchmark/nps/compare-sweep-${{ matrix.attempt }}.json
          if-no-files-found: ignore
