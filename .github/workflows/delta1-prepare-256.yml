name: Delta-1 chess.com 256-puzzle manifest
on:
  push:
    paths:
      - .github/workflows/delta1-prepare-256.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download public September 2026 puzzle snapshot
        run: |
          curl -fL --retry 4 --retry-delay 6 -o /tmp/puzzles-csv.zip https://github.com/IchNukeDichWeg/chess.com-puzzles/releases/download/v2/puzzles-csv.zip
          echo "Archive bytes: $(wc -c </tmp/puzzles-csv.zip)"
      - name: Pick 300 disjoint puzzles rated 2000 to 2500
        run: |
          python -m pip install -q chess
          python - <<'PY'
          import csv,zipfile,io,random,json,chess,collections
          TCN='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?{~}(^)[_]@#$'
          def decode(t):
            z=[]
            for i in range(0,len(t),2):
              a,b=TCN.index(t[i]),TCN.index(t[i+1]);promo=''
              if b>63:
                promo='qnrbk'[(b-64)//3];b=a+(-8 if a<16 else 8)+(b-64)%3-1
              z.append(chess.square_name(a)+chess.square_name(b)+promo)
            return z
          rows=[]
          with zipfile.ZipFile('/tmp/puzzles-csv.zip') as z:
            names=[n for n in z.namelist() if n.lower().endswith('.csv')]
            assert len(names)==1,names
            with z.open(names[0]) as f:
              reader=csv.DictReader(io.TextIOWrapper(f,encoding='utf-8-sig',newline=''))
              for r in reader:
                try:
                  rating=int(r['rating'])
                  if not 2000<=rating<=2500:continue
                  if r['colorOfUser'].lower()!='black':continue
                  moves=decode(r['tcnMoveList'])
                  if len(moves)<2:continue
                  b=chess.Board(r['initialFen']);b.push_uci(moves[0])
                  if b.turn!=chess.BLACK:continue
                  assert chess.Move.from_uci(moves[1]) in b.legal_moves
                  entries={'p':1,'n':2,'b':3,'r':4,'q':5,'k':6}
                  arr=[]
                  for k in range(64):
                    piece=b.piece_at(k)
                    arr.append(0 if not piece else (entries[piece.symbol().lower()] if piece.color else (-entries[piece.symbol().lower()])%256))
                  rows.append(dict(id=int(r['id']),rating=rating,fen=b.fen(),originalFen=r['initialFen'],setup_move=moves[0],solution=moves[1:],boardhex=''.join(f'{x:02x}' for x in arr)))
                except (ValueError,KeyError,IndexError,chess.IllegalMoveError,chess.InvalidMoveError,chess.InvalidError,AssertionError):
                  pass
          random.Random(20261027).shuffle(rows)
          selected=rows[:300]
          assert len({r['id'] for r in selected})==300,len(selected)
          with open('delta1_puzzles_300.json','w') as out:json.dump({'source':'IchNukeDichWeg v2 snapshot 2026-09-16','seed':20261027,'total_eligible':len(rows),'puzzles':selected},out,separators=(',',':'))
          print('ELIGIBLE',len(rows),'SELECTED',len(selected),'FIRST',selected[0]['id'])
          PY
      - name: Commit reproducible manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delta1_puzzles_300.json
          git commit -m "Prepare 300 unique 2000-2500 chess.com puzzles for Delta-1" || exit 0
          git push
