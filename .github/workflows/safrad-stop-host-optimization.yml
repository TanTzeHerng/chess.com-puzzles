name: Stop Safrad host settings experiments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safrad-stop-host-optimization.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel host settings tests only
        shell: bash
        run: |
          gh run cancel 40295341755 -R "$GITHUB_REPOSITORY" || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/40295341755/force-cancel" || true
      - name: Disable host settings experiment workflow
        shell: bash
        run: |
          gh workflow disable safrad21-host-nps-optimize.yml -R "$GITHUB_REPOSITORY" || true
      - name: Verify environment tests unaffected
        shell: bash
        run: |
          gh run view 40295882165 -R "$GITHUB_REPOSITORY" --json status,conclusion,url
          gh run view 40296038261 -R "$GITHUB_REPOSITORY" --json status,conclusion,url
