name: Delta-1 automatic full-puzzle grading
on:
  push:
    paths: [.github/workflows/delta1-full-grading.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: delta1-full-grading-256
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/delta1-full-grading-reset-20261027
      - run: python3 -m pip install --quiet chess ijson
      - name: Prepare the complete 2000-2500 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view delta1-full-state-20261027T081416Z >/dev/null 2>&1 || gh release create delta1-full-state-20261027T081416Z --target experiment/delta1-full-grading-reset-20261027 --prerelease --title "Delta-1 full dataset run checkpoints" --notes "Automatic original-ROM puzzle-run sources and resumable CPU states."
          mkdir -p /tmp/delta1-sources
          if gh release download delta1-full-state-20261027T081416Z --pattern sources-full.json.gz --dir /tmp/delta1-sources --clobber; then
            gzip -dc /tmp/delta1-sources/sources-full.json.gz >delta1_benchmark/sources.json
          else
            python3 delta1_benchmark/prepare_sources.py
            gzip -9 -c delta1_benchmark/sources.json >/tmp/delta1-sources/sources-full.json.gz
            gh release upload delta1-full-state-20261027T081416Z /tmp/delta1-sources/sources-full.json.gz --clobber
          fi
  grade:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      DELTA_BRANCH: experiment/delta1-full-grading-reset-20261027
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/delta1-full-grading-reset-20261027
      - run: python3 -m pip install --quiet chess
      - name: Load complete puzzle sources
        run: |
          mkdir -p /tmp/delta1-sources
          gh release download delta1-full-state-20261027T081416Z --pattern sources-full.json.gz --dir /tmp/delta1-sources --clobber
          gzip -dc /tmp/delta1-sources/sources-full.json.gz >delta1_benchmark/sources.json
      - name: Build unchanged-ROM emulator with verified keypad adapter
        run: g++ -std=c++17 -O3 -DNDEBUG -pthread delta1_benchmark/delta1_puzzle_engine.cpp -o delta1_benchmark/delta1_puzzle_engine
      - name: Restore previous emulated CPU checkpoints
        run: |
          mkdir -p delta1_benchmark/work
          python3 delta1_benchmark/checkpoint_release.py restore ${{ matrix.shard }} delta1_benchmark/work
      - name: Grade all solver moves in 64 distinct lanes
        run: python3 -u delta1_benchmark/cloud_grade.py --shard ${{ matrix.shard }} --budget 19500 --work delta1_benchmark/work
      - name: Save resumable CPU states and all raw grading logs
        if: always()
        run: python3 delta1_benchmark/checkpoint_release.py save ${{ matrix.shard }} delta1_benchmark/work
  continue:
    needs: grade
    if: always() && needs.grade.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DELTA_BRANCH: experiment/delta1-full-grading-reset-20261027
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/delta1-full-grading-reset-20261027
      - name: Resume only if the verified run is unfinished
        run: |
          python3 - <<'PY'
          import json,os,subprocess,sys,urllib.parse
          sys.path.insert(0,'delta1_benchmark')
          from github_feed import api,BRANCH
          import base64
          all_complete=True
          for shard in range(4):
              p=api('contents/delta1_benchmark/progress/shard-'+str(shard)+'.json?ref='+urllib.parse.quote(BRANCH,safe=''))
              d=json.loads(base64.b64decode(p['content']))
              if d['state']!='completed':all_complete=False
          if not all_complete:
              subprocess.run(['gh','workflow','run','delta1-full-grading.yml','--repo',os.environ['GITHUB_REPOSITORY'],'--ref','main'],check=True)
          PY
