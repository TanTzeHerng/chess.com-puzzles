name: Final exact 47 twofold repetition chess audit
# Revision: corrected Python import path for independent cloud workers.

on:
  push:
    branches: [twofold-repetition-audit]
    paths: [.github/workflows/twofold-47-final.yml]
  workflow_dispatch:

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    name: All 47 flagged positions, group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore benchmark inputs and patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > reanalyze_twofold.py
          printf '%s' '' | base64 --decode | gzip --decompress > flagged_40_positions.csv
          printf '%s' '' | base64 --decode | gzip --decompress > stockfish_17_1_twofold.patch
          python3 -m py_compile reanalyze_twofold.py
          python3 reanalyze_twofold.py --dry-run > decisions_to_analyze.txt
          head -n 3 decisions_to_analyze.txt
      - name: Compile patched official Stockfish
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git sf-17.1
          cd sf-17.1
          git apply --check ../stockfish_17_1_twofold.patch
          git apply ../stockfish_17_1_twofold.patch
          make -C src -j2 net
          make -C src -j2 build ARCH=x86-64
          ./src/stockfish <<'EOF'
          uci
          quit
          EOF
      - name: Verify automatic draw on second repetition
        shell: bash
        run: |
          python3 - <<'PY'
          from reanalyze_twofold import Engine
          e=Engine('sf-17.1/src/stockfish',1,64)
          try:
            # After three plies, Black can return to the initial position.
            r=e.search('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
                  ['g1f3','g8f6','f3g1'],3500,1,searchmove='f6g8')
            s=r['lines'][0]
            print('TWO-FOLD SMOKE TEST:',s,flush=True)
            assert s['score_type']=='cp' and abs(s['score'])<=5,(s,r)
          finally:e.close()
          PY
      - name: Install legal chess position library
        run: python3 -m pip install --user 'chess==1.11.2'
      - name: Validate exact original 47 puzzle decision points
        run: python3 twofold-audit/audit_47.py --dry-run --group ${{ matrix.group }} --groups 4
      - name: Reanalyze original flagged alternatives with twofold Stockfish
        run: |
          python3 twofold-audit/audit_47.py --engine sf-17.1/src/stockfish --out audit47_results.jsonl --group ${{ matrix.group }} --groups 4 --threads 2 --hashmb 192 --discover-ms 7000 --verify-ms 25000 --max-verify 4
      - name: Upload auditable results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockfish17-1-twofold-47-group-${{ matrix.group }}
          path: |
            audit47_results.jsonl
            twofold-audit/original_47_mate_recheck.csv
            twofold-audit/recovered_seven.csv
            twofold-audit/audit_47.py
            flagged_40_positions.csv
          if-no-files-found: warn
