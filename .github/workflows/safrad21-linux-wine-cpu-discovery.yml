name: Safrad free Linux Wine CPU discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safrad21-linux-wine-cpu-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample_linux:
    strategy:
      fail-fast: false
      matrix:
        attempt: [0, 1, 2, 3]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SAFRAD_COMPARISON_RUNNER: wine-sweep-${{ matrix.attempt }}
      SAFRAD_COMPARISON_SECONDS: '120'
      WINEDEBUG: '-all'
      WINEPREFIX: /home/runner/.safrad-wine
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout existing measurement script
        uses: actions/checkout@v4
      - name: Install Wine for unmodified Safrad Windows binary
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386
          wineboot -u
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install monitoring dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check requests psutil
      - name: Measure one original Safrad binary
        shell: bash
        run: python -u safrad_benchmark/compare_wine_linux.py
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safrad-wine-sweep-${{ matrix.attempt }}
          path: safrad_benchmark/nps/compare-wine-sweep-${{ matrix.attempt }}.json
          if-no-files-found: ignore
